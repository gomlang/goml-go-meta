name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Install C tools
        run: sudo apt-get update && sudo apt-get install -y clang gcc
      - name: Test metadata and binding tools
        run: go test ./...
      - name: Test C ABI runtime
        working-directory: lib/cabi
        run: CGO_ENABLED=0 go test -gcflags=all=-d=checkptr=2 ./...
      - name: Build standalone installation
        run: |
          bash -n build.sh
          ./build.sh _artifact/toolchain
          test "$(./_artifact/toolchain/bin/goml-c-bind --runtime-dir)" = "$PWD/_artifact/toolchain/lib/cabi"
      - name: Install GoML 0.1.60
        run: |
          mkdir -p _artifact/goml
          curl -fL --retry 3 https://github.com/gomlang/goml/releases/download/v0.1.60/goml-0.1.60-linux-amd64.tar.gz -o _artifact/goml.tar.gz
          printf '%s  %s\n' e5ffdff05df371aa99b46831e86c91110e4e1dbb37f4174f00f010211e98e1cd _artifact/goml.tar.gz | sha256sum -c -
          tar -xzf _artifact/goml.tar.gz --strip-components=1 -C _artifact/goml
          _artifact/goml/bin/goml __toolchain-finalize --prefix "$PWD/_artifact/goml"
      - name: Test independent GoML examples
        run: |
          bash -n test-examples.sh
          GOML_BIN_DIR="$PWD/_artifact/goml/bin" bash test-examples.sh
          git diff --exit-code -- examples
